[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-pms"
version = "0.1.0"
description = "Local, secure AI Powered Port Management System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Dependencies are added only in the phase that implements their use.
core = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]
api = [
    "fastapi>=0.116,<1",
    "PyJWT[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]
database = [
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]
ingestion = [
    "minio>=7.2,<8",
]
pdf = [
    "opendataloader-pdf>=2.0,<3",
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.26,<2",
]
pdf-fallbacks = [
    "docling>=2.70,<3",
    "paddleocr>=3.2,<4",
    "paddlepaddle==3.2.0",
]
retrieval = [
    "FlagEmbedding>=1.3,<2",
    "pgvector>=0.4,<1",
    "transformers>=4.44.2,<5",
]
ml = []
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools]
packages = ["pms_api", "pms_case_workflow", "pms_common", "pms_context", "pms_forecasting", "pms_graph", "pms_ingestion", "pms_retrieval", "pms_rule_engine", "pms_structured"]
package-dir = {pms_api = "apps/api/src/pms_api", pms_case_workflow = "services/case_workflow/src/pms_case_workflow", pms_common = "packages/common/src/pms_common", pms_context = "services/context_engineering/src/pms_context", pms_forecasting = "services/forecasting/src/pms_forecasting", pms_graph = "services/graph/src/pms_graph", pms_ingestion = "services/ingestion/src/pms_ingestion", pms_retrieval = "services/rag/src/pms_retrieval", pms_rule_engine = "services/rule_engine/src/pms_rule_engine", pms_structured = "services/structured_query/src/pms_structured"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", ".virtual_documents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "packages/common/src",
    "services/case_workflow/src",
    "services/context_engineering/src",
    "services/forecasting/src",
    "services/graph/src",
    "services/ingestion/src",
    "services/rag/src",
    "services/rule_engine/src",
    "services/structured_query/src",
    "apps/api/src",
]
files = [
    "packages/common/src",
    "services/case_workflow/src",
    "services/context_engineering/src",
    "services/forecasting/src",
    "services/ingestion/src",
    "services/rag/src",
    "services/rule_engine/src",
    "services/structured_query/src",
    "apps/api/src",
]
